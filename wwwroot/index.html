<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single Page Application</title>
    <link rel="stylesheet" href="css/single-app-page-styles.css">
</head>

<body>
    <div class="tabs">
        <button class="tabButton activeTab" onclick="showTab('datesTab')" id="tab_dates">Dates</button>
        <button class="tabButton" onclick="showTab('booksTab')" id="tab_books">Books</button>
    </div>

    <!-- Onglet Dates -->
    <div id="datesTab" class="tabContent">
        <h1>Welcome to My SPA</h1>
        <p>This is the main content area. Scrollable if content overflows.</p>

        <input type="number" id="n" placeholder="Give a number of date field to insert ">
        <button class="actionButton" onclick="insertNDateFieldsInDocument()">Click Me</button>
        <button class="actionButton" onclick="removeAllDateFieldsInDocument()">Remove All Date Fields</button>

        <div id="dateFieldsContainer">Va etre effacé</div>
    </div>

    <!-- Onglet Books -->
    <div id="booksTab" class="tabContent" style="display:none;">
        <h1>Books</h1>

        <div>
            <input id="bookTitle" placeholder="Title">
            <input id="bookAuthor" placeholder="Author">
            <button class="actionButton" onclick="addBookToApi()">Add Book</button>
        </div>

        <h2>Book List</h2>
        <table id="booksTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="booksTableBody">
            </tbody>
        </table>
    </div>

    <!-- Splitter -->
    <div id="logSplitter">
        <div id="splitterChevron">▼</div>
    </div>

    <!-- Logs -->
    <div class="absoluteBottomLogsPanel" id="logsPanel">
        <h3 class="logTitle">Logs</h3>
        <div id="idDivLogs" class="divLogs"></div>
    </div>

    <script src="js/test.js" defer></script>
</body>
</html>
